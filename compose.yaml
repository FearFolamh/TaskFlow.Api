#--name taskflow-container `
#>>   -p 5000:8080 `
#>>   -e ASPNETCORE_ENVIRONMENT=Production `
#>>   -e ConnectionStrings__DefaultConnection="Data Source=/data/taskflow.db" `
#>>   -v taskflow-data:/data `
#>>   taskflow-api
#*/
services:
  api:
    image: taskflow-api
    container_name: taskflow-container
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/data/taskflow.db"
    volumes:
      - taskflow-data:/data

volumes:
  taskflow-data: